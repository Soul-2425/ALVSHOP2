<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="alvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield / Hexagon Background -->
  <polygon points="256,24 472,120 472,360 256,488 40,360 40,120" fill="#0b0f19" stroke="url(#alvGrad)" stroke-width="16" />

  <!-- Inner Diamond Shape -->
  <polygon points="256,90 400,200 256,410 112,200" fill="url(#alvGrad)" filter="url(#neonGlow)" opacity="0.95" />

  <!-- Diamond Top Facets -->
  <polygon points="256,90 400,200 256,240 112,200" fill="#ffffff" opacity="0.3" />
  <polygon points="256,90 256,240 184,200" fill="#ffffff" opacity="0.2" />
  <polygon points="256,90 256,240 328,200" fill="#ffffff" opacity="0.4" />

  <!-- Diamond Center Core Facets -->
  <polygon points="256,240 400,200 256,410" fill="#1e1b4b" opacity="0.3" />
  <polygon points="256,240 112,200 256,410" fill="#0f172a" opacity="0.4" />

  <!-- Crown / Star Accent -->
  <circle cx="256" cy="180" r="14" fill="#ffffff" filter="url(#neonGlow)" />
</svg>